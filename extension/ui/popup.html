<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Wandful</title>
  <style>
    :root { color-scheme: dark; }
    body { width: 340px; margin: 0; font: 13px/1.45 system-ui, sans-serif; background: #0e0a1c; color: #f4f1ff; }
    header { display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px; }
    header h1 { font-size: 15px; margin: 0; }
    header .tag { margin-left: auto; font-size: 11px; color: #8d81b8; }
    .site { padding: 0 14px 8px; color: #c4b5fd; font-weight: 600; }
    main { padding: 0 14px 14px; }
    button { font: inherit; cursor: pointer; }
    .cast { width: 100%; background: #7c3aed; color: #fff; border: 0; border-radius: 10px; padding: 10px; font-weight: 700; }
    .cast:hover { background: #8b5cf6; }
    section { margin-top: 14px; }
    h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #8d81b8; margin: 0 0 6px; }
    .spell { display: flex; gap: 8px; align-items: center; background: #171129; border: 1px solid #2b2049; border-radius: 10px; padding: 8px 10px; margin-bottom: 6px; }
    .spell .txt { flex: 1; min-width: 0; }
    .spell .intent { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .spell .meta { font-size: 11px; color: #8d81b8; }
    .spell .meta .stale { color: #fbbf24; }
    .iconbtn { background: none; border: 0; color: #8d81b8; padding: 4px; border-radius: 6px; }
    .iconbtn:hover { color: #fff; background: #2b2049; }
    .recipe { display: flex; gap: 8px; align-items: center; background: #171129; border: 1px solid #2b2049; border-radius: 10px; padding: 8px 10px; margin-bottom: 6px; }
    .recipe .txt { flex: 1; min-width: 0; }
    .recipe .title { font-weight: 600; }
    .recipe .desc { font-size: 11px; color: #8d81b8; }
    .install { background: #2b1d55; color: #ddd6fe; border: 1px solid #7c3aed; border-radius: 8px; padding: 5px 10px; white-space: nowrap; }
    .empty { color: #8d81b8; font-size: 12px; padding: 6px 0; }
    footer { display: flex; gap: 12px; padding: 8px 14px; border-top: 1px solid #2b2049; }
    footer a { color: #a78bfa; font-size: 12px; text-decoration: none; }
  </style>
</head>
<body>
  <header>
    <h1>🪄 Wandful</h1>
    <span class="tag">circle it · change it · it sticks</span>
  </header>
  <div class="site" id="site"></div>
  <main>
    <button class="cast" id="cast">Cast here — circle what to change</button>
    <section>
      <h2>Spells on this site</h2>
      <div id="spells"></div>
    </section>
    <section>
      <h2>Recipe library</h2>
      <div id="recipes"></div>
    </section>
  </main>
  <footer>
    <a href="#" id="open-options">Settings / API key</a>
    <a href="#" id="export">Export spells</a>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
